name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS)
    # macos-26, not macos-15: the iOS target's deployment floor is iOS 26.1, and
    # the macos-15 image tops out at Xcode 16.4 / MacOSX15.5.sdk with no iOS 26
    # SDK at all, so "Build iOS (Simulator)" could not compile there. macos-26
    # defaults to Xcode 26.6 and carries iOS Simulator SDKs 26.0 through 26.5.
    # Don't lower this without also lowering project.yml's iOS deploymentTarget.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify Sparkle update config
        run: ./scripts/verify-sparkle-config.sh

      - name: Build
        run: |
          xcodebuild \
            -project AppleNugs.xcodeproj \
            -scheme AppleNugs \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test (host-free unit bundle)
        run: |
          xcodebuild test \
            -project AppleNugs.xcodeproj \
            -scheme AppleNugsTests \
            -destination 'platform=macOS' \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS (Simulator)
        run: |
          xcodebuild \
            -project AppleNugs.xcodeproj \
            -scheme AppleNugs-iOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            build
