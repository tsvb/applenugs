name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (macOS)
    # Xcode >= 27.1 is required: the iOS app compiles iOS 27.1 SDK symbols
    # (ArrangementView and `@available(anyAppleOS 27.1, *)`, for the iPhone Duo
    # two-column now-playing layout) behind `if #available(iOS 27.1, *)`. A
    # missing symbol is a property of the SDK, not of the deployment target, so
    # #available does not help on an older Xcode: macos-26 tops out at Xcode
    # 26.6 and cannot compile them. The iOS deployment floor stays 26.1 in
    # project.yml; only the SDK moved.
    #
    # `xcode-27` is the only GitHub-hosted label carrying Xcode 27.x, and it is
    # still a public preview image (actions/runner-images#14404), so expect
    # occasional queueing or image churn. Xcode 27.1 is pinned via DEVELOPER_DIR
    # because it is GA on every image version in the fleet; /Applications/
    # Xcode_27.2.app was still a symlink to the 27.2 RC on part of the fleet
    # when this was written. "Assert Xcode >= 27.1" exists so that an image
    # which drops or renames that path fails loudly at the top of the job
    # instead of mysteriously at the first 27.1-only symbol.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Assert Xcode >= 27.1
        run: |
          echo "DEVELOPER_DIR=$DEVELOPER_DIR"
          version_output="$(xcodebuild -version)"
          echo "$version_output"
          read -r major minor < <(sed -nE '1s/^Xcode ([0-9]+)(\.([0-9]+))?.*/\1 \3/p' <<<"$version_output") || true
          minor="${minor:-0}"
          if [ -z "$major" ] || [ "$major" -lt 27 ] || { [ "$major" -eq 27 ] && [ "$minor" -lt 1 ]; }; then
            echo "::error::Xcode >= 27.1 is required (iOS 27.1 SDK symbols); got: ${version_output%%$'\n'*}"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify Sparkle update config
        run: ./scripts/verify-sparkle-config.sh

      - name: Build
        run: |
          xcodebuild \
            -project AppleNugs.xcodeproj \
            -scheme AppleNugs \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Test (host-free unit bundle)
        run: |
          xcodebuild test \
            -project AppleNugs.xcodeproj \
            -scheme AppleNugsTests \
            -destination 'platform=macOS' \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS (Simulator)
        run: |
          xcodebuild \
            -project AppleNugs.xcodeproj \
            -scheme AppleNugs-iOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO \
            build
